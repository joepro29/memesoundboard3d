<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Soundboard 3D</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Rajdhani', sans-serif;
            background: #0a0a0f;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            padding: 40px 20px;
            text-align: center;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff0061, #00d4ff);
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            box-shadow: 0 0 30px rgba(255, 0, 97, 0.5);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ff0061, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .tagline {
            font-size: 1rem;
            color: #888;
            margin-bottom: 30px;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
        }

        .stat {
            text-align: center;
        }

        .stat-number {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: #ff0061;
        }

        .stat-label {
            font-size: 0.8rem;
            color: #666;
            text-transform: uppercase;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 0, 97, 0.3);
            border-radius: 12px;
            color: #fff;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 0, 97, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .link:hover::before {
            left: 100%;
        }

        .link:hover {
            background: rgba(255, 0, 97, 0.15);
            border-color: #ff0061;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 0, 97, 0.3);
        }

        .link-icon {
            font-size: 1.3rem;
        }

        .link-primary {
            background: linear-gradient(135deg, #ff0061, #b51b44);
            border: none;
        }

        .link-primary:hover {
            background: linear-gradient(135deg, #ff0061, #ff3385);
        }

        .footer {
            margin-top: 40px;
            font-size: 0.8rem;
            color: #444;
        }

        .footer a {
            color: #ff0061;
            text-decoration: none;
        }

        .emoji-float {
            position: fixed;
            font-size: 24px;
            animation: float 6s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.6; }
            50% { transform: translateY(-20px) rotate(10deg); opacity: 1; }
        }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    
    <div class="container">
        <div class="avatar">🎵</div>
        <h1>Meme Soundboard</h1>
        <p class="tagline">Every meme sound in one place</p>
        
        <div class="stats">
            <div class="stat">
                <div class="stat-number">659+</div>
                <div class="stat-label">Sounds</div>
            </div>
            <div class="stat">
                <div class="stat-number">6</div>
                <div class="stat-label">Categories</div>
            </div>
            <div class="stat">
                <div class="stat-number">FREE</div>
                <div class="stat-label">Always</div>
            </div>
        </div>
        
        <div class="links">
            <a href="https://memesoundboard3d.xyz/" class="link link-primary" target="_blank">
                <span class="link-icon">🔊</span>
                Open Soundboard
            </a>
            <a href="https://memesoundboard3d.xyz/" class="link" target="_blank">
                <span class="link-icon">📱</span>
                Android App
            </a>

            <a href="https://www.tiktok.com/@memesoundboard3d" class="link" target="_blank">
                <span class="link-icon">🎵</span>
                TikTok
            </a>
            <a href="https://twitter.com/memesoundboard3d" class="link" target="_blank">
                <span class="link-icon">🐦</span>
                Twitter / X
            </a>
        </div>
        
        <p class="footer">Made with 💜 by Meme Soundboard 3D</p>
    </div>

    <script>
        // Floating emojis
        const emojis = ['🎵', '🔊', '💥', '😂', '🎮', '🎤', '💀', '🔥'];
        for (let i = 0; i < 8; i++) {
            const emoji = document.createElement('div');
            emoji.className = 'emoji-float';
            emoji.textContent = emojis[i % emojis.length];
            emoji.style.left = Math.random() * 100 + 'vw';
            emoji.style.top = Math.random() * 100 + 'vh';
            emoji.style.animationDelay = Math.random() * 6 + 's';
            document.body.appendChild(emoji);
        }

        // 3D particle background
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = [];
        for (let i = 0; i < 60; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                z: Math.random() * 800,
                size: Math.random() * 2 + 1,
                speedX: (Math.random() - 0.5) * 0.3,
                speedY: (Math.random() - 0.5) * 0.3,
                speedZ: Math.random() * 1.5 + 0.5
            });
        }

        function animate() {
            ctx.fillStyle = 'rgba(10, 10, 15, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach((p, i) => {
                p.x += p.speedX;
                p.y += p.speedY;
                p.z -= p.speedZ;

                if (p.z <= 0) {
                    p.z = 800;
                    p.x = Math.random() * canvas.width;
                    p.y = Math.random() * canvas.height;
                }

                const scale = 800 / p.z;
                const x2d = p.x * scale + canvas.width * (1 - scale);
                const y2d = p.y * scale + canvas.height * (1 - scale);
                const size2d = p.size * scale;

                ctx.beginPath();
                ctx.arc(x2d, y2d, size2d, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 0, 97, ${scale * 0.5})`;
                ctx.fill();

                particles.forEach((p2, j) => {
                    if (i === j) return;
                    const dx = p.x - p2.x;
                    const dy = p.y - p2.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 80) {
                        ctx.beginPath();
                        ctx.moveTo(x2d, y2d);
                        const scale2 = 800 / p2.z;
                        ctx.lineTo(p2.x * scale2 + canvas.width * (1 - scale2), p2.y * scale2 + canvas.height * (1 - scale2));
                        ctx.strokeStyle = `rgba(0, 212, 255, ${(1 - dist / 80) * 0.2})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                });
            });

            requestAnimationFrame(animate);
        }

        animate();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
