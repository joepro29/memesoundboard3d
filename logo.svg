<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff0061;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b9d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="120" rx="16" fill="#0a0a0f"/>
  
  <!-- Sound wave icon -->
  <g transform="translate(20, 35)">
    <!-- Speaker base -->
    <polygon points="0,25 15,15 15,35" fill="url(#grad)"/>
    <!-- Sound waves -->
    <path d="M22,10 Q35,25 22,40" stroke="#ff0061" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M28,2 Q48,25 28,48" stroke="#ff0061" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M34,-6 Q60,25 34,56" stroke="#ff0061" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.4"/>
  </g>
  
  <!-- Text -->
  <text x="90" y="52" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="36" fill="url(#grad)">MEME</text>
  <text x="90" y="88" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="24" fill="#ffffff" letter-spacing="6">SOUNDBOARD</text>
  
  <!-- 3D badge -->
  <rect x="310" y="55" width="55" height="30" rx="6" fill="url(#grad)"/>
  <text x="337" y="76" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle">3D</text>
</svg>